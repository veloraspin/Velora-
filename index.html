<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><meta name="theme-color" content="#06232c"/><meta name="description" content="VELORA — a free-play arcade with six original symbol games."/><title>VELORA | Arcade</title><link rel="stylesheet" href="styles.css"/></head><body>
<header class="topbar"><div class="headrow wrap"><button id="menuBtn" class="cyan">☰ &nbsp; MENU</button><a class="logo" href="/">VELORA</a><button class="badge" data-info="profile"><strong>VELORA</strong><br>FREE PLAY</button></div><div class="ticker">✦ SIX ORIGINAL SYMBOL GAMES &nbsp; · &nbsp; FREE PLAY ONLY &nbsp; · &nbsp; NO CASH VALUE ✦</div></header>
<main class="wrap"><div class="cta"><button class="gold" id="startBtn">▶ &nbsp; SIGN UP</button><button class="cyan" data-info="guide">▤ &nbsp; REGISTER</button></div><section class="summary"><div><div class="label">Session rounds:</div><div class="counter">FREE PLAY · <span id="rounds">0</span></div><p>Matched lines: <b id="matches">0</b></p><p>FAVOURITES <b id="favCount">0</b></p></div><div class="side"><button data-info="deposit">▣ &nbsp; DEPOSIT</button><button data-info="withdraw">▤ &nbsp; WITHDRAW</button><button id="refreshBtn">⟳ &nbsp; REFRESH</button></div></section><section id="games" class="categories" aria-label="Game categories"></section><div class="search"><input id="search" placeholder="Search games..." type="search" aria-label="Search games"><span>⌕</span></div><section id="gallery" class="gallery" aria-label="Game gallery"></section><p class="disclaimer">FREE PLAY · NO CASH VALUE · NO PURCHASE REQUIRED</p></main>
<nav class="bottomnav"><div class="navinner wrap"><button id="navHome"><i>⌂</i>HOME</button><button data-info="history"><i>▤</i>HISTORY</button><button class="centerplay" id="navPlay"><i>▶</i>PLAY</button><button data-info="bonus"><i>♡</i>BONUS</button><button data-info="live chat"><i>♧</i>LIVE CHAT</button></div></nav>
<dialog id="modal" class="modal"><div class="modalhead"><div><small id="eyebrow"></small><h2 id="modalTitle"></h2></div><button id="closeModal" aria-label="Close dialog">✕</button></div><div id="modalBody"></div></dialog><script src="app.js" defer></script></body></html>
